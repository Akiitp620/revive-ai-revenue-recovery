version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: revive-postgres
    environment:
      POSTGRES_USER: revive
      POSTGRES_PASSWORD: revivepassword
      POSTGRES_DB: revivedb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
